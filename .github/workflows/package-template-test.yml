name: Package template compile test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile-examples:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: python -m pip install --upgrade esphome

      - name: Create dummy compile-time secrets
        run: |
          cat > examples/secrets.yaml <<'EOF'
          wifi_ssid: test-wifi
          wifi_password: test-password
          key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          ota_password: test-ota
          EOF

      - name: Test Toshiba frame lengths
        run: |
          g++ -std=c++17 -I. .github/tests/toshiba_frame_test.cpp -o /tmp/toshiba-frame-test
          /tmp/toshiba-frame-test

      - name: Compile examples
        run: |
          for example in examples/*.yaml; do
            [ "$(basename "$example")" = "secrets.yaml" ] && continue
            esphome compile "$example"
          done
