name: Refactor Toshiba A2A generator

on:
  push:
    branches:
      - refactor/toshiba-protocol-model-separation
    paths:
      - .github/workflows/refactor-toshiba-a2a.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/toshiba-protocol-model-separation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply refactor
        run: python tools/refactor_toshiba_a2a.py
      - name: Commit generated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[refactor-generated] Reorganise Toshiba A2A component"
          git push origin HEAD:refactor/toshiba-protocol-model-separation
