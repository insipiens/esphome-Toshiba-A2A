name: One-shot Toshiba A2A refactor

on:
  push:
    branches:
      - refactor/toshiba-protocol-model-separation
    paths:
      - .github/workflows/refactor-toshiba-a2a.yml

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[refactor-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/toshiba-protocol-model-separation

      - name: Reorganise Toshiba component
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import shutil

          root = Path('.')
          old = root / 'components' / 'toshiba_suzumi'
          new = root / 'components' / 'toshiba_a2a'
          if new.exists():
              shutil.rmtree(new)
          shutil.move(str(old), str(new))

          # Mechanical namespace/component rename inside the component itself.
          for path in new.rglob('*'):
              if path.is_file() and path.suffix in {'.h', '.cpp', '.py'}:
                  text = path.read_text()
                  text = text.replace('toshiba_suzumi', 'toshiba_a2a')
                  path.write_text(text)

          # Update consumer-facing platform names and C++ references, but retain
          # provenance references to the upstream project name.
          for rel in [
              'packages/toshiba-a2a-j2.yaml',
              'packages/toshiba-a2a-p2.yaml',
              'examples/output_estimation.yaml',
              'examples/diagnostic_capture.yaml',
              'examples/engineering_telemetry.yaml',
              'components/toshiba_output/__init__.py',
              'components/toshiba_output/toshiba_output.h',
          ]:
              path = root / rel
              text = path.read_text().replace('toshiba_suzumi', 'toshiba_a2a')
              path.write_text(text)

          # Split model/capability data from E0 identity parsing.
          model_h = new / 'toshiba_model.h'
          model_cpp = new / 'toshiba_model.cpp'
          model_h.unlink()
          model_cpp.unlink()

          (new / 'toshiba_model_data.h').write_text(r'''#pragma once

#include <cstdint>
#include <string>

namespace esphome {
namespace toshiba_a2a {

enum class ToshibaIndoorUnitFamily : uint8_t {
  UNKNOWN = 0,
  J2FVG,
  P2KVSG,
};

enum class ToshibaHvacMode : uint8_t {
  UNKNOWN = 0,
  AUTO,
  COOL,
  HEAT,
  DRY,
  FAN,
};

enum ToshibaFeature : uint32_t {
  FEATURE_NONE = 0,
  FEATURE_COMMON_HVAC = 1UL << 0,
  FEATURE_ECO = 1UL << 1,
  FEATURE_HI_POWER = 1UL << 2,
  FEATURE_COMFORT_SLEEP = 1UL << 3,
  FEATURE_POWER_SELECT = 1UL << 4,
  FEATURE_OUTDOOR_SILENT = 1UL << 5,
  FEATURE_FIREPLACE = 1UL << 6,
  FEATURE_EIGHT_DEG_HEAT = 1UL << 7,
  FEATURE_VERTICAL_AIRFLOW = 1UL << 8,
  FEATURE_HORIZONTAL_AIRFLOW = 1UL << 9,
  FEATURE_FLOOR = 1UL << 10,
  FEATURE_AIR_OUTLET_SELECT = 1UL << 11,
  FEATURE_HADA_CARE = 1UL << 12,
  FEATURE_SLEEP = 1UL << 13,
  FEATURE_COMFORT = 1UL << 14,
  FEATURE_PURE = 1UL << 15,
  FEATURE_START_DEFROST = 1UL << 16,
};

enum class ToshibaFeatureScope : uint8_t {
  UNKNOWN = 0,
  IDU_LOCAL,
  IDU_DEMAND,
  SHARED_ODU,
};

enum ToshibaFanOption : uint8_t {
  FAN_OPTION_NONE = 0,
  FAN_OPTION_MANUAL = 1U << 0,
  FAN_OPTION_AUTO = 1U << 1,
  FAN_OPTION_QUIET = 1U << 2,
};

enum class ToshibaLouvreEncoding : uint8_t {
  UNKNOWN = 0,
  J2_VERTICAL,
  P2_PACKED,
};

struct ToshibaCapabilityProfile {
  uint32_t features{FEATURE_NONE};

  bool has(ToshibaFeature feature) const {
    return (features & static_cast<uint32_t>(feature)) != 0;
  }
};

struct ToshibaModelProfile {
  ToshibaIndoorUnitFamily family{ToshibaIndoorUnitFamily::UNKNOWN};
  const char *family_name{"UNKNOWN"};
  ToshibaLouvreEncoding louvre_encoding{ToshibaLouvreEncoding::UNKNOWN};
  ToshibaCapabilityProfile capabilities{};
};

const ToshibaModelProfile &model_profile_from_model(const std::string &model);
const ToshibaModelProfile &model_profile_from_family(ToshibaIndoorUnitFamily family);
ToshibaIndoorUnitFamily indoor_unit_family_from_model(const std::string &model);
const char *indoor_unit_family_to_string(ToshibaIndoorUnitFamily family);
ToshibaCapabilityProfile capability_profile_from_model(const std::string &model);
ToshibaLouvreEncoding louvre_encoding_for_family(ToshibaIndoorUnitFamily family);
ToshibaFeatureScope feature_scope(ToshibaFeature feature);
const char *feature_scope_to_string(ToshibaFeatureScope scope);

bool has_validated_mode_profile(ToshibaIndoorUnitFamily family);
ToshibaCapabilityProfile validated_function_profile_for_mode(ToshibaIndoorUnitFamily family,
                                                              ToshibaHvacMode mode);
uint8_t validated_fan_options_for_mode(ToshibaIndoorUnitFamily family, ToshibaHvacMode mode);
ToshibaCapabilityProfile power_select_cancel_profile(ToshibaIndoorUnitFamily family,
                                                      ToshibaHvacMode mode);
bool validated_strong_defrost_allowed(ToshibaIndoorUnitFamily family, ToshibaHvacMode mode);

}  // namespace toshiba_a2a
}  // namespace esphome
''')

          (new / 'toshiba_model_data.cpp').write_text(r'''#include "toshiba_model_data.h"

namespace esphome {
namespace toshiba_a2a {

namespace {

constexpr uint32_t COMMON_RESIDENTIAL_FEATURES =
    FEATURE_COMMON_HVAC |
    FEATURE_ECO |
    FEATURE_HI_POWER |
    FEATURE_COMFORT_SLEEP |
    FEATURE_POWER_SELECT |
    FEATURE_OUTDOOR_SILENT |
    FEATURE_FIREPLACE |
    FEATURE_EIGHT_DEG_HEAT |
    FEATURE_VERTICAL_AIRFLOW |
    FEATURE_SLEEP |
    FEATURE_COMFORT;

constexpr uint32_t J2FVG_FEATURES =
    FEATURE_COMMON_HVAC |
    FEATURE_ECO |
    FEATURE_HI_POWER |
    FEATURE_COMFORT_SLEEP |
    FEATURE_POWER_SELECT |
    FEATURE_OUTDOOR_SILENT |
    FEATURE_FIREPLACE |
    FEATURE_EIGHT_DEG_HEAT |
    FEATURE_VERTICAL_AIRFLOW |
    FEATURE_FLOOR |
    FEATURE_AIR_OUTLET_SELECT;

static constexpr ToshibaModelProfile UNKNOWN_PROFILE = {
    ToshibaIndoorUnitFamily::UNKNOWN,
    "UNKNOWN",
    ToshibaLouvreEncoding::UNKNOWN,
    {FEATURE_COMMON_HVAC},
};

static constexpr ToshibaModelProfile J2_PROFILE = {
    ToshibaIndoorUnitFamily::J2FVG,
    "J2FVG",
    ToshibaLouvreEncoding::J2_VERTICAL,
    {J2FVG_FEATURES},
};

static constexpr ToshibaModelProfile P2_PROFILE = {
    ToshibaIndoorUnitFamily::P2KVSG,
    "P2KVSG",
    ToshibaLouvreEncoding::P2_PACKED,
    {COMMON_RESIDENTIAL_FEATURES |
     FEATURE_HORIZONTAL_AIRFLOW |
     FEATURE_PURE |
     FEATURE_START_DEFROST},
};

struct ToshibaModeFunctionEntry {
  ToshibaIndoorUnitFamily family;
  ToshibaHvacMode mode;
  uint32_t features;
  uint8_t fan_options;
};

static constexpr ToshibaModeFunctionEntry TOSHIBA_VALIDATED_MODE_FUNCTIONS[] = {
    {ToshibaIndoorUnitFamily::J2FVG, ToshibaHvacMode::AUTO,
     FEATURE_POWER_SELECT | FEATURE_ECO | FEATURE_HI_POWER |
         FEATURE_OUTDOOR_SILENT | FEATURE_COMFORT_SLEEP,
     FAN_OPTION_MANUAL | FAN_OPTION_AUTO | FAN_OPTION_QUIET},
    {ToshibaIndoorUnitFamily::J2FVG, ToshibaHvacMode::COOL,
     FEATURE_POWER_SELECT | FEATURE_ECO | FEATURE_HI_POWER |
         FEATURE_OUTDOOR_SILENT | FEATURE_COMFORT_SLEEP,
     FAN_OPTION_MANUAL | FAN_OPTION_AUTO | FAN_OPTION_QUIET},
    {ToshibaIndoorUnitFamily::J2FVG, ToshibaHvacMode::HEAT,
     FEATURE_POWER_SELECT | FEATURE_ECO | FEATURE_HI_POWER |
         FEATURE_OUTDOOR_SILENT | FEATURE_COMFORT_SLEEP |
         FEATURE_FIREPLACE | FEATURE_EIGHT_DEG_HEAT | FEATURE_FLOOR,
     FAN_OPTION_MANUAL | FAN_OPTION_AUTO | FAN_OPTION_QUIET},
    {ToshibaIndoorUnitFamily::J2FVG, ToshibaHvacMode::DRY,
     FEATURE_POWER_SELECT,
     FAN_OPTION_AUTO},
    {ToshibaIndoorUnitFamily::J2FVG, ToshibaHvacMode::FAN,
     FEATURE_POWER_SELECT,
     FAN_OPTION_MANUAL | FAN_OPTION_AUTO | FAN_OPTION_QUIET},

    {ToshibaIndoorUnitFamily::P2KVSG, ToshibaHvacMode::AUTO,
     FEATURE_POWER_SELECT | FEATURE_ECO | FEATURE_HI_POWER |
         FEATURE_OUTDOOR_SILENT | FEATURE_PURE | FEATURE_START_DEFROST,
     FAN_OPTION_MANUAL | FAN_OPTION_AUTO | FAN_OPTION_QUIET},
    {ToshibaIndoorUnitFamily::P2KVSG, ToshibaHvacMode::COOL,
     FEATURE_POWER_SELECT | FEATURE_ECO | FEATURE_HI_POWER |
         FEATURE_OUTDOOR_SILENT | FEATURE_PURE,
     FAN_OPTION_MANUAL | FAN_OPTION_AUTO | FAN_OPTION_QUIET},
    {ToshibaIndoorUnitFamily::P2KVSG, ToshibaHvacMode::HEAT,
     FEATURE_POWER_SELECT | FEATURE_ECO | FEATURE_HI_POWER |
         FEATURE_OUTDOOR_SILENT | FEATURE_PURE | FEATURE_EIGHT_DEG_HEAT |
         FEATURE_START_DEFROST,
     FAN_OPTION_MANUAL | FAN_OPTION_AUTO | FAN_OPTION_QUIET},
    {ToshibaIndoorUnitFamily::P2KVSG, ToshibaHvacMode::DRY,
     FEATURE_POWER_SELECT | FEATURE_PURE,
     FAN_OPTION_AUTO},
    {ToshibaIndoorUnitFamily::P2KVSG, ToshibaHvacMode::FAN,
     FEATURE_POWER_SELECT | FEATURE_PURE,
     FAN_OPTION_MANUAL | FAN_OPTION_AUTO | FAN_OPTION_QUIET},
};

}  // namespace

const ToshibaModelProfile &model_profile_from_model(const std::string &model) {
  if (model.find("J2FVG") != std::string::npos) return J2_PROFILE;
  if (model.find("P2KVSG") != std::string::npos) return P2_PROFILE;
  return UNKNOWN_PROFILE;
}

const ToshibaModelProfile &model_profile_from_family(ToshibaIndoorUnitFamily family) {
  switch (family) {
    case ToshibaIndoorUnitFamily::J2FVG: return J2_PROFILE;
    case ToshibaIndoorUnitFamily::P2KVSG: return P2_PROFILE;
    default: return UNKNOWN_PROFILE;
  }
}

ToshibaIndoorUnitFamily indoor_unit_family_from_model(const std::string &model) {
  return model_profile_from_model(model).family;
}

const char *indoor_unit_family_to_string(ToshibaIndoorUnitFamily family) {
  return model_profile_from_family(family).family_name;
}

ToshibaCapabilityProfile capability_profile_from_model(const std::string &model) {
  return model_profile_from_model(model).capabilities;
}

ToshibaLouvreEncoding louvre_encoding_for_family(ToshibaIndoorUnitFamily family) {
  return model_profile_from_family(family).louvre_encoding;
}

ToshibaFeatureScope feature_scope(ToshibaFeature feature) {
  switch (feature) {
    case FEATURE_VERTICAL_AIRFLOW:
    case FEATURE_HORIZONTAL_AIRFLOW:
    case FEATURE_FLOOR:
    case FEATURE_AIR_OUTLET_SELECT:
    case FEATURE_FIREPLACE:
    case FEATURE_HADA_CARE:
    case FEATURE_PURE:
      return ToshibaFeatureScope::IDU_LOCAL;
    case FEATURE_COMMON_HVAC:
    case FEATURE_ECO:
    case FEATURE_HI_POWER:
    case FEATURE_COMFORT_SLEEP:
    case FEATURE_EIGHT_DEG_HEAT:
    case FEATURE_SLEEP:
    case FEATURE_COMFORT:
      return ToshibaFeatureScope::IDU_DEMAND;
    case FEATURE_POWER_SELECT:
    case FEATURE_OUTDOOR_SILENT:
    case FEATURE_START_DEFROST:
      return ToshibaFeatureScope::SHARED_ODU;
    default:
      return ToshibaFeatureScope::UNKNOWN;
  }
}

const char *feature_scope_to_string(ToshibaFeatureScope scope) {
  switch (scope) {
    case ToshibaFeatureScope::IDU_LOCAL: return "IDU local";
    case ToshibaFeatureScope::IDU_DEMAND: return "IDU demand / shared consequence";
    case ToshibaFeatureScope::SHARED_ODU: return "Shared ODU";
    default: return "Unknown";
  }
}

bool has_validated_mode_profile(ToshibaIndoorUnitFamily family) {
  return family == ToshibaIndoorUnitFamily::J2FVG || family == ToshibaIndoorUnitFamily::P2KVSG;
}

ToshibaCapabilityProfile validated_function_profile_for_mode(ToshibaIndoorUnitFamily family,
                                                              ToshibaHvacMode mode) {
  ToshibaCapabilityProfile profile;
  for (const auto &entry : TOSHIBA_VALIDATED_MODE_FUNCTIONS) {
    if (entry.family == family && entry.mode == mode) {
      profile.features = entry.features;
      break;
    }
  }
  return profile;
}

uint8_t validated_fan_options_for_mode(ToshibaIndoorUnitFamily family, ToshibaHvacMode mode) {
  for (const auto &entry : TOSHIBA_VALIDATED_MODE_FUNCTIONS) {
    if (entry.family == family && entry.mode == mode) return entry.fan_options;
  }
  return FAN_OPTION_NONE;
}

ToshibaCapabilityProfile power_select_cancel_profile(ToshibaIndoorUnitFamily family,
                                                      ToshibaHvacMode mode) {
  ToshibaCapabilityProfile profile;
  if (family == ToshibaIndoorUnitFamily::P2KVSG &&
      (mode == ToshibaHvacMode::AUTO || mode == ToshibaHvacMode::COOL ||
       mode == ToshibaHvacMode::HEAT)) {
    profile.features = FEATURE_ECO | FEATURE_HI_POWER | FEATURE_OUTDOOR_SILENT;
  }
  return profile;
}

bool validated_strong_defrost_allowed(ToshibaIndoorUnitFamily family, ToshibaHvacMode mode) {
  return family == ToshibaIndoorUnitFamily::P2KVSG && mode == ToshibaHvacMode::HEAT;
}

}  // namespace toshiba_a2a
}  // namespace esphome
''')

