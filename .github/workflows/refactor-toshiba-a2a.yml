          (new / 'toshiba_louvre.cpp').write_text(r'''#include "toshiba_louvre.h"

namespace esphome {
namespace toshiba_a2a {

bool encode_vertical_fix_command(ToshibaLouvreEncoding encoding, uint8_t requested_vertical,
                                 uint8_t retained_horizontal, uint8_t &raw) {
  if (requested_vertical < 1 || requested_vertical > 5) return false;
  switch (encoding) {
    case ToshibaLouvreEncoding::J2_VERTICAL:
      raw = static_cast<uint8_t>(0x4F + requested_vertical);
      return true;
    case ToshibaLouvreEncoding::P2_PACKED:
      raw = EncodePackedFixPosition(retained_horizontal, requested_vertical);
      return true;
    default:
      return false;
  }
}

bool encode_horizontal_fix_command(ToshibaLouvreEncoding encoding, uint8_t requested_horizontal,
                                   uint8_t retained_vertical, uint8_t &raw) {
  if (encoding != ToshibaLouvreEncoding::P2_PACKED || requested_horizontal < 1 || requested_horizontal > 5)
    return false;
  raw = EncodePackedFixPosition(requested_horizontal, retained_vertical);
  return true;
}

bool encode_swing_command(ToshibaLouvreEncoding encoding, climate::ClimateSwingMode mode, uint8_t &raw) {
  if (encoding == ToshibaLouvreEncoding::J2_VERTICAL) {
    if (mode == climate::CLIMATE_SWING_OFF) {
      raw = 0x31;
      return true;
    }
    if (mode == climate::CLIMATE_SWING_VERTICAL) {
      raw = 0x41;
      return true;
    }
    return false;
  }
  if (encoding == ToshibaLouvreEncoding::P2_PACKED) {
    raw = ClimateSwingModeToCommand(mode);
    return true;
  }
  return false;
}

ToshibaFixPosition decode_fix_state(ToshibaLouvreEncoding encoding, uint8_t raw) {
  ToshibaFixPosition result;
  if (encoding == ToshibaLouvreEncoding::J2_VERTICAL) {
    if (raw >= 0x50 && raw <= 0x54) {
      result.valid = true;
      result.vertical = static_cast<uint8_t>(raw - 0x4F);
    }
    return result;
  }
  if (encoding == ToshibaLouvreEncoding::P2_PACKED) {
    uint8_t horizontal = 0;
    uint8_t vertical = 0;
    if (DecodePackedFixPosition(raw, horizontal, vertical)) {
      result.valid = true;
      result.horizontal = horizontal;
      result.vertical = vertical;
    }
  }
  return result;
}

bool decode_ordinary_swing_state(ToshibaLouvreEncoding encoding, uint8_t raw,
                                 climate::ClimateSwingMode &mode) {
  if (encoding == ToshibaLouvreEncoding::J2_VERTICAL) {
    if (raw == 0x31) {
      mode = climate::CLIMATE_SWING_OFF;
      return true;
    }
    if (raw == 0x41) {
      mode = climate::CLIMATE_SWING_VERTICAL;
      return true;
    }
    return false;
  }
  if (encoding == ToshibaLouvreEncoding::P2_PACKED) {
    switch (raw) {
      case 0x31: mode = climate::CLIMATE_SWING_OFF; return true;
      case 0x41: mode = climate::CLIMATE_SWING_VERTICAL; return true;
      case 0x42: mode = climate::CLIMATE_SWING_HORIZONTAL; return true;
      case 0x43: mode = climate::CLIMATE_SWING_BOTH; return true;
      default: return false;
    }
  }
  return false;
}

}  // namespace toshiba_a2a
}  // namespace esphome
''')

