esphome:
  name: climate-living-room

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source:
      type: git
      url: https://github.com/insipiens/esphome-Toshiba-A2A
      ref: main
    components: [toshiba_suzumi]
    refresh: 1min

logger:
  level: INFO

uart:
  id: uart_bus
  tx_pin: 33
  rx_pin: 32
  parity: EVEN
  baud_rate: 9600

# Optional. Required only for features that use the Toshiba energy/time data.
# time:
#   - platform: homeassistant
#     id: hass_time

climate:
  - platform: toshiba_suzumi
    name: "Living Room"
    id: living_room
    uart_id: uart_bus

    # Equipment identity is obtained from pushed 0xE0 traffic when the IDU
    # publishes it. Some older/different firmware has been observed to publish
    # NULL for the IDU model, in which case the IDU Model entity is unavailable.
    idu_model:
      name: "IDU Model"
    odu_model:
      name: "ODU Model"

    indoor_temp:
      name: "Indoor Temperature"
    outdoor_temp:
      name: "Outdoor Temperature"

    power_select:
      name: "Power Select"

    vertical_air_direction:
      name: "Vertical Air Direction"

    # The controls below are the divided replacement for the legacy
    # supported_presets list. Do not assume every Toshiba IDU supports every
    # function. Enable only those appropriate to the unit while the automatic
    # capability/mode matrix remains under development.
    #
    # eco:
    #   name: "ECO"
    # hi_power:
    #   name: "Hi POWER"
    # fireplace:
    #   name: "Fireplace"
    # eight_degree_heat:
    #   name: "8 Degree Heat"
    # outdoor_silent:
    #   name: "Outdoor Silent"
    # sleep:
    #   name: "Sleep"
    # floor:
    #   name: "Floor"
    # comfort:
    #   name: "Comfort"

    # Optional status/engineering entities. Availability differs significantly
    # by IDU model and firmware; sentinel values are not exposed as measurements.
    # self_clean:
    #   name: "Self Clean"
    # compressor_load:
    #   name: "Compressor Load"
    # compressor_current:
    #   name: "Compressor Current"
    # odu_discharge_temp:
    #   name: "ODU Discharge Temperature"
    # odu_suction_temp:
    #   name: "ODU Suction Temperature"
    # odu_heat_exchanger_temp:
    #   name: "ODU Heat Exchanger Temperature"
    # idu_heat_exchanger_temp:
    #   name: "IDU Heat Exchanger Temperature"
    # idu_junction_temp:
    #   name: "IDU Junction Temperature"
    # idu_fan_speed:
    #   name: "IDU Fan/Airflow Raw"

    # Optional legacy settings retained during migration.
    # horizontal_swing: true
    # disable_wifi_led: true
    # disable_heat_mode: true
    # min_temp: 17
    # time_id: hass_time
    # time_sync_interval: 24h
    # energy:
    #   name: "Daily Energy"

# Optional passive UART capture. This sends no scan requests while enabled.
switch:
  - platform: template
    name: "Toshiba Passive UART Capture"
    icon: "mdi:chart-timeline-variant"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: |-
          auto* controller = static_cast<toshiba_suzumi::ToshibaClimateUart*>(id(living_room));
          controller->set_scan_enabled(true);
    turn_off_action:
      - lambda: |-
          auto* controller = static_cast<toshiba_suzumi::ToshibaClimateUart*>(id(living_room));
          controller->set_scan_enabled(false);

api:
  encryption:
    key: !secret ha_enc_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:
