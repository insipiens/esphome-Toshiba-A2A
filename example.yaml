# Minimal current example for this project.
#
# Development and direct testing are being carried out on ESP32 hardware,
# primarily ESP32-C3 SuperMini based adapters. GPIO assignments below are
# examples only: use the pins wired on your own adapter.

esphome:
  name: toshiba-a2a

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

external_components:
  - source:
      type: git
      url: https://github.com/insipiens/esphome-Toshiba-A2A
      ref: main
    components: [toshiba_suzumi]
    refresh: 1min

logger:
  level: INFO

uart:
  id: uart_bus
  tx_pin: GPIO4   # example only
  rx_pin: GPIO5   # example only
  parity: EVEN
  baud_rate: 9600

climate:
  - platform: toshiba_suzumi
    name: "Toshiba A2A"
    id: toshiba_a2a
    uart_id: uart_bus

    # Equipment identity is decoded from Toshiba-pushed 0xE0 traffic when
    # supplied by the IDU firmware. Some tested firmware publishes NULL for
    # the IDU model; that is reported as unavailable rather than guessed.
    idu_model:
      name: "IDU Model"
    odu_model:
      name: "ODU Model"

    indoor_temp:
      name: "Indoor Temperature"
    outdoor_temp:
      name: "Outdoor Temperature"

    power_select:
      name: "Power Select"

    vertical_air_direction:
      name: "Vertical Air Direction"

    # The Toshiba-specific controls below are implemented but are still being
    # validated against exact IDU model and HVAC-mode restrictions. Enable
    # only controls you have established are appropriate to your unit.
    # eco:
    #   name: "ECO"
    # hi_power:
    #   name: "Hi POWER"
    # fireplace:
    #   name: "Fireplace"
    # eight_degree_heat:
    #   name: "8 Degree Heat"
    # outdoor_silent:
    #   name: "Outdoor Silent"
    # sleep:
    #   name: "Sleep"
    # floor:
    #   name: "Floor"
    # comfort:
    #   name: "Comfort"

api:
  encryption:
    key: !secret ha_enc_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:
