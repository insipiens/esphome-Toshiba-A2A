esphome:
  name: climate-living-room

esp8266:
  board: d1_mini

external_components:
  - source:
      type: git
      url: https://github.com/insipiens/esphome-Toshiba-A2A
      ref: main
    components: [toshiba_suzumi]
    refresh: 1min

logger:
  level: INFO

uart:
  id: uart_bus
  tx_pin: 13
  rx_pin: 12
  parity: EVEN
  baud_rate: 9600

climate:
  - platform: toshiba_suzumi
    name: "Living Room"
    id: living_room
    uart_id: uart_bus

    idu_model:
      name: "IDU Model"
    odu_model:
      name: "ODU Model"

    indoor_temp:
      name: "Indoor Temperature"
    outdoor_temp:
      name: "Outdoor Temperature"

    power_select:
      name: "Power Select"

    # Optional divided Toshiba controls. Availability is model/firmware and
    # operating-mode dependent; enable only controls appropriate to the unit.
    # eco:
    #   name: "ECO"
    # hi_power:
    #   name: "Hi POWER"
    # fireplace:
    #   name: "Fireplace"
    # eight_degree_heat:
    #   name: "8 Degree Heat"
    # outdoor_silent:
    #   name: "Outdoor Silent"
    # sleep:
    #   name: "Sleep"
    # floor:
    #   name: "Floor"
    # comfort:
    #   name: "Comfort"

api:
  encryption:
    key: !secret ha_enc_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:
