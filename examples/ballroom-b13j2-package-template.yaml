# Minimal consuming YAML for the Ballroom RAS-B13J2FVG-E1 test unit.
# All Toshiba climate controls, sensors, identity persistence and output
# estimation are supplied by the GitHub package. MQTT is intentionally absent.

substitutions:
  device_name: "acballroom"
  friendly_name: "AC ballroom"
  room_name: "Ballroom"

packages:
  toshiba_a2a:
    url: https://github.com/insipiens/esphome-Toshiba-A2A
    ref: feature/package-template
    files:
      - packages/toshiba-a2a-j2.yaml
    refresh: 0s

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret iot_wifi_ssid
      password: !secret iot_wifi_password
    - ssid: !secret iot2_wifi_ssid
      password: !secret iot2_wifi_password

  ap:
    ssid: ballroom Hotspot
    password: !secret fallback_password

captive_portal:

logger:
  level: debug

api:
  encryption:
    key: !secret key

ota:
  platform: esphome
  password: !secret ota_password

web_server:
  port: 80
