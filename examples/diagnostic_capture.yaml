# Development/research example: active-controller Focused Monitor.
#
# This is not a two-channel passive sniffer. The component is the active
# controller and records its normal TX plus IDU RX traffic without exploratory
# scan requests. For genuine-adaptor capture use passive-uart-sniffer.yaml.

substitutions:
  device_name: toshiba-a2a-diagnostic

esphome:
  name: ${device_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/insipiens/esphome-Toshiba-A2A
      ref: main
    components: [toshiba_a2a]
    refresh: 1min

logger:
  level: DEBUG

uart:
  id: uart_bus
  tx_pin: GPIO21
  rx_pin: GPIO20
  parity: EVEN
  baud_rate: 9600

climate:
  - platform: toshiba_a2a
    name: "Toshiba A2A"
    id: room_id
    uart_id: uart_bus
    idu_model:
      name: "IDU Model"
    odu_model:
      name: "ODU Model"

switch:
  - platform: template
    name: "Toshiba Focused Monitor"
    icon: "mdi:chart-timeline-variant"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: |-
          auto* controller = static_cast<toshiba_a2a::ToshibaClimateUart*>(id(room_id));
          controller->set_scan_enabled(true);
    turn_off_action:
      - lambda: |-
          auto* controller = static_cast<toshiba_a2a::ToshibaClimateUart*>(id(room_id));
          controller->set_scan_enabled(false);

api:
  encryption:
    key: !secret ha_enc_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
