# Development/research example: Toshiba IDU/ODU engineering telemetry.
#
# E4/E5 availability and semantics vary by IDU model and firmware. Some tested
# units return sentinel values to active reads while Toshiba-pushed class-0x11
# traffic contains useful live values. Do not treat these sensors as universally
# available across Toshiba units.

esphome:
  name: toshiba-a2a-telemetry

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

external_components:
  - source:
      type: git
      url: https://github.com/insipiens/esphome-Toshiba-A2A
      ref: main
    components: [toshiba_a2a]
    refresh: 1min

logger:
  level: INFO

uart:
  id: uart_bus
  tx_pin: GPIO4   # example only
  rx_pin: GPIO5   # example only
  parity: EVEN
  baud_rate: 9600

climate:
  - platform: toshiba_a2a
    name: "Toshiba A2A"
    id: toshiba_a2a
    uart_id: uart_bus

    idu_model:
      name: "IDU Model"
    odu_model:
      name: "ODU Model"

    indoor_temp:
      name: "Indoor Temperature"
    outdoor_temp:
      name: "Outdoor Temperature"

    idu_heat_exchanger_temp:
      name: "IDU Heat Exchanger Temperature"
    idu_junction_temp:
      name: "IDU Junction Temperature"
    idu_fan_speed:
      # E4+2 is live IDU fan-speed feedback. On the tested units one count is
      # approximately 10 rpm (for example 61 ~= 610 rpm).
      name: "IDU Fan Speed (RPM/10)"

    odu_discharge_temp:
      name: "ODU Discharge Temperature"
    odu_suction_temp:
      name: "ODU Suction Temperature"
    odu_heat_exchanger_temp:
      name: "ODU Heat Exchanger Temperature"
    compressor_load:
      # Current interpretation is an IDU-associated load/allocation quantity.
      # Exact system semantics remain under investigation.
      name: "IDU Load"
    compressor_current:
      # Current-like E5 field. Scaling has been calibrated against an external
      # meter on the test installation, but locality/system semantics remain
      # under investigation.
      name: "Current-like Telemetry"

api:
  encryption:
    key: !secret ha_enc_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
