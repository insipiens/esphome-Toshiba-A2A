# Minimal consuming YAML for the installed Kitchen RAS-B10P2KVSGB-E.
# The exact IDU model is mandatory; the package derives the family profile,
# capabilities and family-specific command encoding from it.

substitutions:
  device_name: "toshiba-a2a-02"
  friendly_name: "toshiba-A2A-Ki"
  room_name: "Kitchen"
  idu_model: "RAS-B10P2KVSGB-E"

packages:
  toshiba_a2a:
    url: https://github.com/insipiens/esphome-Toshiba-A2A
    ref: main
    files:
      - packages/toshiba-a2a-p2.yaml
    refresh: 0s

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret iot_wifi_ssid
      password: !secret iot_wifi_password
    - ssid: !secret iot2_wifi_ssid
      password: !secret iot2_wifi_password

  ap:
    ssid: kitchen Hotspot
    password: !secret fallback_password

captive_portal:

logger:
  level: debug

api:
  encryption:
    key: !secret key

ota:
  platform: esphome
  password: !secret ota_password

web_server:
  port: 80
