# CI/reference fixture: older J2 model through the universal Toshiba package.
substitutions:
  device_name: "toshiba-a2a-03"
  friendly_name: "Toshiba A2A Office"
  toshiba_model: "RAS-B10J2FVG-E"

packages:
  toshiba_a2a:
    url: https://github.com/insipiens/esphome-Toshiba-A2A
    ref: refactor/toshiba-protocol-model-separation
    files:
      - packages/toshiba-a2a.yaml
    refresh: 0s

# This older controller accepts J2 FIX commands but does not implement the
# expected physical FIX behaviour/readback, so the user-level override disables
# only that feature.
climate:
  - id: !extend room_id
    disable_features:
      - fixed_position

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret iot_wifi_ssid
      password: !secret iot_wifi_password
    - ssid: !secret iot2_wifi_ssid
      password: !secret iot_wifi_password
  ap:
    ssid: office Hotspot
    password: !secret fallback_password

captive_portal:

logger:
  level: debug

api:
  encryption:
    key: !secret key

ota:
  platform: esphome
  password: !secret ota_password

web_server:
  port: 80
