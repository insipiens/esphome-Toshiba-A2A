# Experimental sensible thermal-output estimator.
#
# Repository responsibility:
#   - decode Toshiba registers and equipment identity
#   - interpret E4+2 fan/air-velocity feedback into model-specific airflow where calibrated
#   - publish interpreted engineering values
#
# ESPHome YAML responsibility:
#   - retain Home Assistant/application data across reboot
#   - restore the last valid equipment identity into runtime state
#   - configure derived calculations and calibration
#
# For supported IDUs the output estimator combines:
#   - retained E0-detected IDU model
#   - Toshiba-reported room/return-air temperature (0xBB)
#   - Toshiba IDU heat-exchanger temperature (E4 +0)
#   - Toshiba fan/air-velocity feedback (E4 +2)
#   - model-specific airflow calibration
#
# RAS-B10P2KVSGB-E currently uses provisional piecewise E4+2-to-airflow calibration
# anchored by observed fixed fan levels and the B10-class airflow profile. Other
# models continue to use their fixed/manual lookup until their feedback calibration
# has been established.

esphome:
  name: toshiba-a2a-output-test
  on_boot:
    priority: -200
    then:
      - lambda: |-
          auto *controller = static_cast<toshiba_a2a::ToshibaClimateUart *>(id(toshiba_a2a));
          if (!id(saved_idu_model).empty())
            controller->restore_idu_model(id(saved_idu_model));
          if (!id(saved_odu_model).empty())
            controller->restore_odu_model(id(saved_odu_model));

preferences:
  flash_write_interval: 10min

globals:
  - id: saved_idu_model
    type: std::string
    restore_value: yes
    max_restore_data_length: 32
    initial_value: '""'

  - id: saved_odu_model
    type: std::string
    restore_value: yes
    max_restore_data_length: 32
    initial_value: '""'

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/insipiens/esphome-Toshiba-A2A
      ref: main
    components: [toshiba_a2a, toshiba_output]
    refresh: 0s

logger:
  level: INFO

uart:
  id: uart_bus
  tx_pin: GPIO21
  rx_pin: GPIO20
  parity: EVEN
  baud_rate: 9600

climate:
  - platform: toshiba_a2a
    name: "Toshiba A2A"
    id: toshiba_a2a
    uart_id: uart_bus

    indoor_temp:
      name: "IDU Room Temperature"

    idu_heat_exchanger_temp:
      name: "IDU Heat Exchanger Temperature"
      id: idu_hx_temp

    idu_fan_speed:
      name: "IDU Fan Feedback"
      id: idu_fan_feedback

    idu_model:
      name: "IDU Model"
      id: idu_model
      on_value:
        then:
          - lambda: |-
              if (!x.empty() && x != "Unknown" && x != "Unavailable")
                id(saved_idu_model) = x;

    odu_model:
      name: "ODU Model"
      id: odu_model
      on_value:
        then:
          - lambda: |-
              if (!x.empty() && x != "Unknown" && x != "Unavailable")
                id(saved_odu_model) = x;

# Sensible thermal-output calculation:
#   Q = rho_air * cp_air * Vdot * delta-T * heat_exchanger_factor
# with the sign/mode handled internally.
toshiba_output:
  climate_id: toshiba_a2a
  heat_exchanger_temperature: idu_hx_temp
  fan_feedback: idu_fan_feedback

  airflow:
    name: "Toshiba IDU Airflow"

  cooling_output:
    name: "Estimated IDU Cooling Output"

  heating_output:
    name: "Estimated IDU Heating Output"

  heat_exchanger_factor: 1.0

api:
  encryption:
    key: !secret ha_enc_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
