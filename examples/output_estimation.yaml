# Experimental sensible thermal-output estimator.
#
# For supported IDUs the component combines:
#   - E0 detected IDU model
#   - Toshiba-reported room/return-air temperature (0xBB)
#   - Toshiba IDU heat-exchanger temperature (E4 +0)
#   - current fixed fan setting
#   - Toshiba manufacturer airflow for that model/mode/fan setting
#
# Auto and Quiet are intentionally not estimated yet because they do not map to
# one fixed manufacturer airflow value. Use a fixed Low / Low-Medium / Medium /
# Medium-High / High fan setting while validating the estimator.
#
# heat_exchanger_factor starts at 1.0. That gives the raw HX-delta estimate for
# comparison testing. Fit this factor from simultaneous HX and outlet-air
# measurements before treating the result as calibrated delivered sensible heat.

esphome:
  name: toshiba-a2a-output-test

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/insipiens/esphome-Toshiba-A2A
      ref: main
    components: [toshiba_suzumi, toshiba_output]
    refresh: 0s

logger:
  level: INFO

uart:
  id: uart_bus
  tx_pin: GPIO21
  rx_pin: GPIO20
  parity: EVEN
  baud_rate: 9600

climate:
  - platform: toshiba_suzumi
    name: "Toshiba A2A"
    id: toshiba_a2a
    uart_id: uart_bus

    indoor_temp:
      name: "IDU Room Temperature"

    idu_heat_exchanger_temp:
      name: "IDU Heat Exchanger Temperature"
      id: idu_hx_temp

    idu_model:
      name: "IDU Model"

# Sensible thermal-output calculation:
#   Q = rho_air * cp_air * Vdot * (T_hx - T_room) * heat_exchanger_factor
# with the sign/mode handled internally.
toshiba_output:
  climate_id: toshiba_a2a
  heat_exchanger_temperature: idu_hx_temp

  airflow:
    name: "Toshiba IDU Airflow"

  cooling_output:
    name: "Estimated IDU Cooling Output"

  heating_output:
    name: "Estimated IDU Heating Output"

  heat_exchanger_factor: 1.0

api:
  encryption:
    key: !secret ha_enc_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
