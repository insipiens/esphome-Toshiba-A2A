# Standalone development fixture for the sensible thermal-output estimator.
#
# Normal installations receive this estimator from packages/toshiba-a2a.yaml.
# This file exists for isolated component development. The P2 airflow endpoints
# are provisional pending published data or direct airflow calibration.

esphome:
  name: toshiba-a2a-output-test

preferences:
  flash_write_interval: 10min

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/insipiens/esphome-Toshiba-A2A
      ref: main
    components: [toshiba_a2a, toshiba_output]
    refresh: 0s

logger:
  level: INFO

uart:
  id: uart_bus
  tx_pin: GPIO21
  rx_pin: GPIO20
  parity: EVEN
  baud_rate: 9600

climate:
  - platform: toshiba_a2a
    name: "Toshiba A2A"
    id: room_id
    uart_id: uart_bus
    model_override: "RAS-B10P2KVSGB-E"

    indoor_temp:
      name: "IDU Room Temperature"

    idu_heat_exchanger_temp:
      name: "IDU Heat Exchanger Temperature"
      id: idu_hx_temp

    idu_fan_speed:
      name: "IDU Fan Feedback"
      id: idu_fan_feedback

    idu_model:
      name: "IDU Model"

    odu_model:
      name: "ODU Model"

number:
  - platform: template
    name: "IDU Output Multiplier"
    id: idu_output_multiplier
    min_value: 0.0
    max_value: 1.0
    step: 0.01
    initial_value: 1.0
    optimistic: true
    restore_value: true
    mode: box

# Q = rho_air * cp_air * Vdot * delta-T * heat_exchanger_factor
#     * output_multiplier
toshiba_output:
  climate_id: room_id
  heat_exchanger_temperature: idu_hx_temp
  fan_feedback: idu_fan_feedback
  output_multiplier: idu_output_multiplier

  airflow:
    name: "Toshiba IDU Airflow"

  cooling_output:
    name: "Estimated IDU Cooling Output"

  heating_output:
    name: "Estimated IDU Heating Output"

  heat_exchanger_factor: 1.0

api:
  encryption:
    key: !secret ha_enc_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
