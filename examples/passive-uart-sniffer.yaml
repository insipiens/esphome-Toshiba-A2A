# Passive dual-channel Toshiba UART sniffer.
#
# Both monitored signals are connected to ESP32 RX inputs only. This example
# does not instantiate the Toshiba climate controller and must not transmit on
# either signal line. See docs/SNIFFER.md before connecting hardware.
#
# Toshiba frames may be split across several ESPHome UART-debug callbacks.
# toshiba_uart_sniffer.h buffers each direction and logs complete frames using
# the protocol length field.

substitutions:
  device_name: "toshiba-uart-sniffer"

esphome:
  name: ${device_name}
  includes:
    - toshiba_uart_sniffer.h

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG
  tx_buffer_size: 2048

uart:
  - id: idu_to_adapter
    rx_pin:
      number: GPIO20
      mode:
        input: true
        pullup: false
    baud_rate: 9600
    data_bits: 8
    parity: EVEN
    stop_bits: 1
    rx_buffer_size: 2048
    debug:
      direction: RX
      dummy_receiver: true
      after:
        timeout: 20ms
      sequence:
        - lambda: |-
            static toshiba_uart_sniffer::StreamState state;
            toshiba_uart_sniffer::process(state, bytes, "IDU->WIFI");

  - id: adapter_to_idu
    rx_pin:
      number: GPIO21
      mode:
        input: true
        pullup: false
    baud_rate: 9600
    data_bits: 8
    parity: EVEN
    stop_bits: 1
    rx_buffer_size: 2048
    debug:
      direction: RX
      dummy_receiver: true
      after:
        timeout: 20ms
      sequence:
        - lambda: |-
            static toshiba_uart_sniffer::StreamState state;
            toshiba_uart_sniffer::process(state, bytes, "WIFI->IDU");

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret key

ota:
  - platform: esphome
    password: !secret ota_password
