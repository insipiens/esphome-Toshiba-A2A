# Reference configuration for an older RAS-B10J2FVG-family console IDU
# whose pushed E0 identity reports no usable IDU model string.
#
# UI intent:
#   Climate / Airflow  - normal climate card + local air controls
#   Performance        - ECO / Hi POWER (local demand, shared ODU consequence)
#   System             - Power Select / Outdoor Silent (shared ODU effect)
#
# Engineering and identity entities remain available for diagnostics, but are
# marked diagnostic so the normal Home Assistant device page stays concise.
#
# NOTE: Comfort Sleep is a genuine J2 feature, but its wire mapping is being
# separated from the inherited 0x94 OFF-timer interpretation before it is added
# to this reference configuration. Legacy F7 Sleep/Comfort controls are omitted.

esphome:
  name: toshiba-a2a-03
  friendly_name: toshiba-A2A-OF

  platformio_options:
    board_build.f_cpu: 80000000L

  on_boot:
    priority: -200
    then:
      - lambda: |-
          auto *controller =
              static_cast<toshiba_suzumi::ToshibaClimateUart *>(id(room_id));

          if (!id(saved_idu_model).empty())
            controller->restore_idu_model(id(saved_idu_model));

          if (!id(saved_idu_identity_1).empty())
            controller->restore_idu_identity_1(id(saved_idu_identity_1));

          if (!id(saved_idu_identity_2).empty())
            controller->restore_idu_identity_2(id(saved_idu_identity_2));

          if (!id(saved_idu_identity_3).empty())
            controller->restore_idu_identity_3(id(saved_idu_identity_3));

          if (!id(saved_odu_model).empty())
            controller->restore_odu_model(id(saved_odu_model));

          if (!id(saved_odu_identity_1).empty())
            controller->restore_odu_identity_1(id(saved_odu_identity_1));

          if (!id(saved_odu_identity_2).empty())
            controller->restore_odu_identity_2(id(saved_odu_identity_2));

          if (!id(saved_odu_identity_3).empty())
            controller->restore_odu_identity_3(id(saved_odu_identity_3));

preferences:
  flash_write_interval: 10min

globals:
  - id: saved_idu_model
    type: std::string
    restore_value: yes
    max_restore_data_length: 32
    initial_value: '""'

  - id: saved_idu_identity_1
    type: std::string
    restore_value: yes
    max_restore_data_length: 32
    initial_value: '""'

  - id: saved_idu_identity_2
    type: std::string
    restore_value: yes
    max_restore_data_length: 32
    initial_value: '""'

  - id: saved_idu_identity_3
    type: std::string
    restore_value: yes
    max_restore_data_length: 32
    initial_value: '""'

  - id: saved_odu_model
    type: std::string
    restore_value: yes
    max_restore_data_length: 32
    initial_value: '""'

  - id: saved_odu_identity_1
    type: std::string
    restore_value: yes
    max_restore_data_length: 32
    initial_value: '""'

  - id: saved_odu_identity_2
    type: std::string
    restore_value: yes
    max_restore_data_length: 32
    initial_value: '""'

  - id: saved_odu_identity_3
    type: std::string
    restore_value: yes
    max_restore_data_length: 32
    initial_value: '""'

substitutions:
  device_index: "a2a-03"
  inroom: "Office"

mqtt:
  broker: !secret mqtt_server
  username: !secret mqtt_user
  password: !secret mqtt_password
  topic_prefix: "toshiba/${device_index}"
  discovery: false
  log_topic: null

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret iot_wifi_ssid
      password: !secret iot_wifi_password
    - ssid: !secret iot2_wifi_ssid
      password: !secret iot2_wifi_password

  ap:
    ssid: office Hotspot
    password: !secret fallback_password

captive_portal:

web_server:
  port: 80

logger:
  level: debug

api:
  encryption:
    key: !secret key

ota:
  platform: esphome
  password: !secret ota_password

external_components:
  - source:
      type: git
      url: https://github.com/insipiens/esphome-Toshiba-A2A
      ref: feature/model-aware-interface
    components:
      - toshiba_suzumi
      - toshiba_output
    refresh: 0s

uart:
  id: uart_bus
  tx_pin: 21
  rx_pin: 20
  parity: EVEN
  baud_rate: 9600

time:
  - platform: homeassistant
    id: hass_time

climate:
  - platform: toshiba_suzumi
    name: ${inroom}
    id: room_id
    uart_id: uart_bus

    # Static fallback used only when Toshiba E0 does not provide a usable IDU
    # model. The raw IDU Model diagnostic remains the reported/restored value.
    # The effective model drives J2 feature logic and exact-model airflow lookup.
    model_override: "RAS-B10J2FVG-E"

    state_topic: null

    time_id: hass_time
    time_sync_interval: 24h

    # --- System: affects the shared outdoor system ---
    power_select:
      name: "Power level"
      state_topic: null

    outdoor_silent:
      name: "Outdoor Silent"
      state_topic: null

    # --- Performance: local demand strategy, shared ODU consequence ---
    eco:
      name: "ECO"
      state_topic: null

    hi_power:
      name: "Hi POWER"
      state_topic: null

    # --- Air / Room: local IDU behaviour ---
    # Fireplace and 8 °C remain separate transport controls on this development
    # branch; the final J2 UI will consolidate the mutually-exclusive user state.
    fireplace:
      name: "Fireplace"
      state_topic: null

    eight_degree_heat:
      name: "8 Degree Heat"
      state_topic: null

    floor:
      name: "Floor"
      state_topic: null

    # --- Engineering / diagnostic entities ---
    energy:
      name: "IDU Daily Energy"
      id: idu_daily_energy
      state_topic: null
      entity_category: diagnostic

    indoor_temp:
      name: "Indoor Temp"
      id: indoor_temp
      state_topic: null

    outdoor_temp:
      name: "Outdoor Temp"
      id: outdoor_temp
      state_topic: null
      entity_category: diagnostic

    self_clean:
      name: "IDU Self Clean Active"
      id: self_clean_state
      state_topic: null
      entity_category: diagnostic

    defrost_active:
      name: "Defrost Active"
      id: defrost_active_state
      state_topic: null
      entity_category: diagnostic

    compressor_load:
      name: "IDU Load"
      id: compressor_load
      state_topic: null
      entity_category: diagnostic

    compressor_current:
      name: "IDU Current"
      id: idu_current
      state_topic: null
      entity_category: diagnostic

    odu_discharge_temp:
      name: "ODU Discharge Temp"
      id: odu_discharge_temp
      state_topic: null
      entity_category: diagnostic

    odu_suction_temp:
      name: "ODU Suction Temp"
      id: odu_suction_temp
      state_topic: null
      entity_category: diagnostic

    odu_heat_exchanger_temp:
      name: "ODU Heat Exchanger Temp"
      id: odu_heat_exchanger_temp
      state_topic: null
      entity_category: diagnostic

    idu_heat_exchanger_temp:
      name: "IDU Heat Exchanger Temp"
      id: room_hx
      state_topic: null
      entity_category: diagnostic

    idu_junction_temp:
      name: "IDU Junction Temp"
      id: idu_branch_temp
      state_topic: null
      entity_category: diagnostic

    idu_fan_speed:
      name: "IDU Fan RPM"
      id: idu_fan_speed
      state_topic: null
      entity_category: diagnostic

    idu_model:
      name: "IDU Model"
      id: idu_model
      state_topic: null
      entity_category: diagnostic
      on_value:
        then:
          - lambda: |-
              if (!x.empty() &&
                  x != "NULL" &&
                  x != "Unknown" &&
                  x != "Unavailable") {
                id(saved_idu_model) = x;
              }

    idu_identity_1:
      name: "IDU Identity 1"
      id: idu_identity_1
      state_topic: null
      entity_category: diagnostic
      on_value:
        then:
          - lambda: |-
              if (!x.empty() && x != "NULL" && x != "Unknown" && x != "Unavailable")
                id(saved_idu_identity_1) = x;

    idu_identity_2:
      name: "IDU Identity 2"
      id: idu_identity_2
      state_topic: null
      entity_category: diagnostic
      on_value:
        then:
          - lambda: |-
              if (!x.empty() && x != "NULL" && x != "Unknown" && x != "Unavailable")
                id(saved_idu_identity_2) = x;

    idu_identity_3:
      name: "IDU Identity 3"
      id: idu_identity_3
      state_topic: null
      entity_category: diagnostic
      on_value:
        then:
          - lambda: |-
              if (!x.empty() && x != "NULL" && x != "Unknown" && x != "Unavailable")
                id(saved_idu_identity_3) = x;

    odu_model:
      name: "ODU Model"
      id: odu_model
      state_topic: null
      entity_category: diagnostic
      on_value:
        then:
          - lambda: |-
              if (!x.empty() && x != "NULL" && x != "Unknown" && x != "Unavailable")
                id(saved_odu_model) = x;

    odu_identity_1:
      name: "ODU Identity 1"
      id: odu_identity_1
      state_topic: null
      entity_category: diagnostic
      on_value:
        then:
          - lambda: |-
              if (!x.empty() && x != "NULL" && x != "Unknown" && x != "Unavailable")
                id(saved_odu_identity_1) = x;

    odu_identity_2:
      name: "ODU Identity 2"
      id: odu_identity_2
      state_topic: null
      entity_category: diagnostic
      on_value:
        then:
          - lambda: |-
              if (!x.empty() && x != "NULL" && x != "Unknown" && x != "Unavailable")
                id(saved_odu_identity_2) = x;

    odu_identity_3:
      name: "ODU Identity 3"
      id: odu_identity_3
      state_topic: null
      entity_category: diagnostic
      on_value:
        then:
          - lambda: |-
              if (!x.empty() && x != "NULL" && x != "Unknown" && x != "Unavailable")
                id(saved_odu_identity_3) = x;

toshiba_output:
  climate_id: room_id
  heat_exchanger_temperature: room_hx
  fan_feedback: idu_fan_speed

  airflow:
    name: "IDU Airflow"
    id: idu_airflow
    state_topic: null
    entity_category: diagnostic

  heating_output:
    name: "Heating Output"
    id: heating_output
    state_topic: null
    entity_category: diagnostic

  cooling_output:
    name: "Cooling Output"
    id: cooling_output
    state_topic: null
    entity_category: diagnostic

  heat_exchanger_factor: 1.0

interval:
  - interval: 1min
    then:
      - mqtt.publish_json:
          topic: "toshiba/${device_index}/telemetry"
          payload: |-
            root["energy"] = id(idu_daily_energy).state;
            root["indoor_temp"] = id(indoor_temp).state;
            root["outdoor_temp"] = id(outdoor_temp).state;
            root["compressor_load"] = id(compressor_load).state;
            root["compressor_current"] = id(idu_current).state;
            root["input_power"] = id(toshiba_input_power).state;
            root["odu_discharge_temp"] = id(odu_discharge_temp).state;
            root["odu_suction_temp"] = id(odu_suction_temp).state;
            root["odu_heat_exchanger_temp"] = id(odu_heat_exchanger_temp).state;
            root["idu_heat_exchanger_temp"] = id(room_hx).state;
            root["idu_junction_temp"] = id(idu_branch_temp).state;
            root["idu_fan_speed"] = id(idu_fan_speed).state;
            root["airflow"] = id(idu_airflow).state;
            root["heating_output"] = id(heating_output).state;
            root["cooling_output"] = id(cooling_output).state;
            root["idu_model"] = id(idu_model).state;
            root["idu_identity_1"] = id(idu_identity_1).state;
            root["idu_identity_2"] = id(idu_identity_2).state;
            root["idu_identity_3"] = id(idu_identity_3).state;
            root["odu_model"] = id(odu_model).state;
            root["odu_identity_1"] = id(odu_identity_1).state;
            root["odu_identity_2"] = id(odu_identity_2).state;
            root["odu_identity_3"] = id(odu_identity_3).state;
            root["self_clean"] = id(self_clean_state).state;
            root["defrost_active"] = id(defrost_active_state).state;

switch:
  - platform: template
    name: "Toshiba focused monitor"
    id: toshiba_focused_monitor
    icon: "mdi:chart-timeline-variant"
    optimistic: true
    restore_mode: ALWAYS_OFF
    state_topic: null
    entity_category: diagnostic

    turn_on_action:
      - lambda: |-
          auto *controller =
              static_cast<toshiba_suzumi::ToshibaClimateUart *>(id(room_id));
          controller->set_scan_enabled(true);

    turn_off_action:
      - lambda: |-
          auto *controller =
              static_cast<toshiba_suzumi::ToshibaClimateUart *>(id(room_id));
          controller->set_scan_enabled(false);

sensor:
  - platform: homeassistant
    id: toshiba_input_power
    entity_id: sensor.shellyproem50_energy_meter_0_power
    internal: true
