# Validated control example for RAS-B10P2KVSGB-E.
#
# GPIO assignments are examples only. Use the pins wired on your own ESP32-C3
# adapter. This example reflects the directly captured Toshiba app behaviour on
# the tested P2 high-wall unit as of 14 Sep 2026.
#
# Home Assistant model:
#   - climate entity: HVAC mode, temperature, Fan Speed and standard swing
#   - Function entities: Power Select, ECO, Hi POWER, Silent Operation, PURE,
#     8 °C Heat and defrost actions
#   - vertical FIX is a separate six-position select because Home Assistant's
#     climate swing modes cannot represent Toshiba's fixed louvre positions
#   - horizontal FIX is deliberately not exposed yet: six A3 states were
#     captured while Toshiba presents five UI positions, so the exact mapping
#     still needs one more controlled test
#
# P2 mode rules are enforced in the component. In particular Dry forces Auto
# fan, and changing Power Select in Auto/Cool/Heat cancels ECO/Hi POWER/Silent
# while leaving PURE unchanged.

esphome:
  name: toshiba-b10p2

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

external_components:
  - source:
      type: git
      url: https://github.com/insipiens/esphome-Toshiba-A2A
      ref: main
    components: [toshiba_suzumi, toshiba_output]
    refresh: 1min

logger:
  level: INFO

uart:
  id: uart_bus
  tx_pin: GPIO4   # example only
  rx_pin: GPIO5   # example only
  parity: EVEN
  baud_rate: 9600

climate:
  - platform: toshiba_suzumi
    name: "Kitchen A2A"
    id: toshiba_a2a
    uart_id: uart_bus
    horizontal_swing: true

    idu_model:
      name: "IDU Model"
    odu_model:
      name: "ODU Model"

    indoor_temp:
      name: "Indoor Temperature"
    outdoor_temp:
      name: "Outdoor Temperature"

    idu_heat_exchanger_temp:
      name: "IDU Heat Exchanger Temperature"
    idu_junction_temp:
      name: "IDU Junction Temperature"
    idu_fan_speed:
      name: "IDU Fan Speed (RPM/10)"

    # Standard Off/Vertical/Horizontal/Both swing remains on the climate entity.
    # This select is only the directly captured six-position vertical FIX sweep
    # (A3 88..8D), avoiding two competing swing controls.
    vertical_air_direction:
      name: "Vertical Fixed Position"

    # Optional explicit horizontal swing control. Fixed horizontal positions are
    # intentionally withheld until the five UI positions are tied unambiguously
    # to the six captured packed A3 states.
    horizontal_air_direction:
      name: "Horizontal Swing"

    # Toshiba app Function group.
    power_select:
      name: "Function - Power Select"
    eco:
      name: "Function - ECO"
    hi_power:
      name: "Function - Hi POWER"
    outdoor_silent:
      name: "Function - Silent Operation"
    pure:
      name: "Function - PURE"
    eight_degree_heat:
      name: "Function - 8 °C Heat"
    start_defrost:
      name: "Function - Start Defrost"

    # Strong Defrost was captured separately from normal Start Defrost. It is
    # deliberately exposed as a separate action and is restricted to Heat on the
    # validated P2 path.
    strong_defrost:
      name: "Strong Defrost"
    defrost_active:
      name: "Confirmed Strong Defrost Active"

# Optional sensible-output estimator. The P2 fan-speed envelope is directly
# observed as E4+2 = 51..103 (~510..1030 rpm); the P2 airflow endpoints remain
# provisional until exact Toshiba P2 service airflow data is available.
#
# toshiba_output:
#   climate_id: toshiba_a2a
#   ...

api:
  encryption:
    key: !secret ha_enc_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:
