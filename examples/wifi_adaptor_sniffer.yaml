# Passive Toshiba Wi-Fi adaptor UART sniffer using an ESP32-C3 SuperMini.
#
# Wiring to the genuine Toshiba Wi-Fi adaptor test pads:
#   adaptor VCC (5V) -> ESP32-C3 SuperMini 5V
#   adaptor GND      -> ESP32-C3 SuperMini GND
#   adaptor RXD      -> GPIO20  (IDU -> Wi-Fi adaptor, RX only)
#   adaptor TXD      -> GPIO21  (Wi-Fi adaptor -> IDU, RX only)
#
# IMPORTANT:
#   Measure RXD/TXD high level before direct connection. This YAML assumes the
#   labelled test pads are on the adaptor's 3.3V logic side. Do not connect a
#   5V logic signal directly to an ESP32-C3 GPIO.
#
# Both GPIO20 and GPIO21 are configured as UART RX inputs. There is deliberately
# no TX pin in either UART definition, so the sniffer does not drive the bus.
#
# Protocol observed on the Toshiba link:
#   9600 baud, 8 data bits, EVEN parity, 1 stop bit.
#
# Capture mechanism:
#   ESPHome UART debug collects bytes independently in both directions. A frame
#   is emitted after 20 ms of silence, giving timestamp, direction, byte count,
#   and full hexadecimal payload. Run `esphome logs` and save the terminal output
#   while issuing one Toshiba app/cloud command at a time.
#
# Expected log lines:
#   IDU->WIFI  t=123456ms len=15 02.00.03....
#   WIFI->IDU  t=123507ms len=15 02.00.03....

substitutions:
  name: toshiba-wifi-sniffer
  friendly_name: Toshiba WiFi Sniffer

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# Keep logging off the UART peripherals being used for capture.
logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret key

ota:
  - platform: esphome
    password: !secret ota_password

uart:
  # Adaptor RXD is the signal arriving at the Wi-Fi adaptor from the IDU.
  - id: idu_to_wifi_uart
    rx_pin:
      number: GPIO20
      mode:
        input: true
        pullup: false
    baud_rate: 9600
    data_bits: 8
    parity: EVEN
    stop_bits: 1
    rx_buffer_size: 2048
    debug:
      direction: RX
      dummy_receiver: true
      after:
        timeout: 20ms
      sequence:
        - lambda: |-
            ESP_LOGI("toshiba_sniffer",
                     "IDU->WIFI  t=%ums  len=%u  %s",
                     (unsigned) millis(),
                     (unsigned) bytes.size(),
                     format_hex_pretty(bytes).c_str());

  # Adaptor TXD is the signal transmitted by the Wi-Fi adaptor toward the IDU.
  - id: wifi_to_idu_uart
    rx_pin:
      number: GPIO21
      mode:
        input: true
        pullup: false
    baud_rate: 9600
    data_bits: 8
    parity: EVEN
    stop_bits: 1
    rx_buffer_size: 2048
    debug:
      direction: RX
      dummy_receiver: true
      after:
        timeout: 20ms
      sequence:
        - lambda: |-
            ESP_LOGI("toshiba_sniffer",
                     "WIFI->IDU  t=%ums  len=%u  %s",
                     (unsigned) millis(),
                     (unsigned) bytes.size(),
                     format_hex_pretty(bytes).c_str());
