# Reusable ESPHome package for the validated Toshiba P2 high-wall profile.
#
# The consuming device YAML must provide the exact IDU model plus naming and
# local Wi-Fi/API/OTA secrets. The declared model selects the runtime family,
# capability matrix and family-specific command encoding.
# MQTT is intentionally not included; it is a project-specific test transport.

substitutions:
  device_name: "toshiba-a2a"
  friendly_name: "Toshiba A2A"
  room_name: "Toshiba A2A"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

  platformio_options:
    board_build.f_cpu: 80000000L

  on_boot:
    priority: -200
    then:
      - lambda: |-
          auto *controller =
              static_cast<toshiba_suzumi::ToshibaClimateUart *>(id(room_id));

          if (!id(saved_idu_model).empty()) controller->restore_idu_model(id(saved_idu_model));
          if (!id(saved_idu_identity_1).empty()) controller->restore_idu_identity_1(id(saved_idu_identity_1));
          if (!id(saved_idu_identity_2).empty()) controller->restore_idu_identity_2(id(saved_idu_identity_2));
          if (!id(saved_idu_identity_3).empty()) controller->restore_idu_identity_3(id(saved_idu_identity_3));
          if (!id(saved_odu_model).empty()) controller->restore_odu_model(id(saved_odu_model));
          if (!id(saved_odu_identity_1).empty()) controller->restore_odu_identity_1(id(saved_odu_identity_1));
          if (!id(saved_odu_identity_2).empty()) controller->restore_odu_identity_2(id(saved_odu_identity_2));
          if (!id(saved_odu_identity_3).empty()) controller->restore_odu_identity_3(id(saved_odu_identity_3));

preferences:
  flash_write_interval: 10min

globals:
  - { id: saved_idu_model, type: std::string, restore_value: yes, max_restore_data_length: 32, initial_value: '""' }
  - { id: saved_idu_identity_1, type: std::string, restore_value: yes, max_restore_data_length: 32, initial_value: '""' }
  - { id: saved_idu_identity_2, type: std::string, restore_value: yes, max_restore_data_length: 32, initial_value: '""' }
  - { id: saved_idu_identity_3, type: std::string, restore_value: yes, max_restore_data_length: 32, initial_value: '""' }
  - { id: saved_odu_model, type: std::string, restore_value: yes, max_restore_data_length: 32, initial_value: '""' }
  - { id: saved_odu_identity_1, type: std::string, restore_value: yes, max_restore_data_length: 32, initial_value: '""' }
  - { id: saved_odu_identity_2, type: std::string, restore_value: yes, max_restore_data_length: 32, initial_value: '""' }
  - { id: saved_odu_identity_3, type: std::string, restore_value: yes, max_restore_data_length: 32, initial_value: '""' }

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/insipiens/esphome-Toshiba-A2A
      ref: main
    components:
      - toshiba_suzumi
      - toshiba_output
    refresh: 0s

uart:
  id: uart_bus
  tx_pin: 21
  rx_pin: 20
  parity: EVEN
  baud_rate: 9600

time:
  - platform: homeassistant
    id: hass_time

climate:
  - platform: toshiba_suzumi
    name: ${room_name}
    id: room_id
    uart_id: uart_bus
    model_override: ${idu_model}
    time_id: hass_time
    time_sync_interval: 24h

    horizontal_swing: true

    power_select:
      name: "Power level"
    eco:
      name: "ECO"
    hi_power:
      name: "Hi POWER"
    outdoor_silent:
      name: "Outdoor Silent"
    pure:
      name: "PURE"
    eight_degree_heat:
      name: "8 Degree Heat"
    start_defrost:
      name: "Start Defrost"
      entity_category: diagnostic
    strong_defrost:
      name: "Strong Defrost"
      entity_category: diagnostic
    defrost_active:
      name: "Defrost Active"
      id: defrost_active_state
      entity_category: diagnostic
    self_clean:
      name: "IDU Self Clean Active"
      id: self_clean_state
      entity_category: diagnostic
    vertical_air_direction:
      name: "Vertical Fixed Position"
    horizontal_air_direction:
      name: "Horizontal Fixed Position"

    energy:
      name: "IDU Daily Energy"
      id: idu_daily_energy
      entity_category: diagnostic
    indoor_temp:
      name: "Indoor Temp"
      id: indoor_temp
    outdoor_temp:
      name: "Outdoor Temp"
      id: outdoor_temp
      entity_category: diagnostic
    compressor_load:
      name: "IDU Load"
      id: compressor_load
      entity_category: diagnostic
    compressor_current:
      name: "IDU Current"
      id: idu_current
      entity_category: diagnostic
    odu_discharge_temp:
      name: "ODU Discharge Temp"
      id: odu_discharge_temp
      entity_category: diagnostic
    odu_suction_temp:
      name: "ODU Suction Temp"
      id: odu_suction_temp
      entity_category: diagnostic
    odu_heat_exchanger_temp:
      name: "ODU Heat Exchanger Temp"
      id: odu_heat_exchanger_temp
      entity_category: diagnostic
    idu_heat_exchanger_temp:
      name: "IDU Heat Exchanger Temp"
      id: room_hx
      entity_category: diagnostic
    idu_junction_temp:
      name: "IDU Junction Temp"
      id: idu_branch_temp
      entity_category: diagnostic
    idu_fan_speed:
      name: "IDU Fan RPM"
      id: idu_fan_speed
      entity_category: diagnostic

    idu_model:
      name: "IDU Model"
      id: idu_model
      entity_category: diagnostic
      on_value:
        then:
          - lambda: |-
              if (!x.empty() && x != "NULL" && x != "Unknown" && x != "Unavailable") id(saved_idu_model) = x;
    idu_identity_1:
      name: "IDU Identity 1"
      id: idu_identity_1
      entity_category: diagnostic
      on_value:
        then:
          - lambda: |-
              if (!x.empty() && x != "NULL" && x != "Unknown" && x != "Unavailable") id(saved_idu_identity_1) = x;
    idu_identity_2:
      name: "IDU Identity 2"
      id: idu_identity_2
      entity_category: diagnostic
      on_value:
        then:
          - lambda: |-
              if (!x.empty() && x != "NULL" && x != "Unknown" && x != "Unavailable") id(saved_idu_identity_2) = x;
    idu_identity_3:
      name: "IDU Identity 3"
      id: idu_identity_3
      entity_category: diagnostic
      on_value:
        then:
          - lambda: |-
              if (!x.empty() && x != "NULL" && x != "Unknown" && x != "Unavailable") id(saved_idu_identity_3) = x;
    odu_model:
      name: "ODU Model"
      id: odu_model
      entity_category: diagnostic
      on_value:
        then:
          - lambda: |-
              if (!x.empty() && x != "NULL" && x != "Unknown" && x != "Unavailable") id(saved_odu_model) = x;
    odu_identity_1:
      name: "ODU Identity 1"
      id: odu_identity_1
      entity_category: diagnostic
      on_value:
        then:
          - lambda: |-
              if (!x.empty() && x != "NULL" && x != "Unknown" && x != "Unavailable") id(saved_odu_identity_1) = x;
    odu_identity_2:
      name: "ODU Identity 2"
      id: odu_identity_2
      entity_category: diagnostic
      on_value:
        then:
          - lambda: |-
              if (!x.empty() && x != "NULL" && x != "Unknown" && x != "Unavailable") id(saved_odu_identity_2) = x;
    odu_identity_3:
      name: "ODU Identity 3"
      id: odu_identity_3
      entity_category: diagnostic
      on_value:
        then:
          - lambda: |-
              if (!x.empty() && x != "NULL" && x != "Unknown" && x != "Unavailable") id(saved_odu_identity_3) = x;

toshiba_output:
  climate_id: room_id
  heat_exchanger_temperature: room_hx
  fan_feedback: idu_fan_speed
  airflow:
    name: "IDU Airflow"
    id: idu_airflow
    entity_category: diagnostic
  heating_output:
    name: "Heating Output"
    id: heating_output
    entity_category: diagnostic
  cooling_output:
    name: "Cooling Output"
    id: cooling_output
    entity_category: diagnostic
  heat_exchanger_factor: 1.0

switch:
  - platform: template
    name: "Toshiba focused monitor"
    id: toshiba_focused_monitor
    icon: "mdi:chart-timeline-variant"
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: diagnostic
    turn_on_action:
      - lambda: |-
          auto *controller = static_cast<toshiba_suzumi::ToshibaClimateUart *>(id(room_id));
          controller->set_scan_enabled(true);
    turn_off_action:
      - lambda: |-
          auto *controller = static_cast<toshiba_suzumi::ToshibaClimateUart *>(id(room_id));
          controller->set_scan_enabled(false);
